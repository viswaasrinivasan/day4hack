<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My ID Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <img id="photo" src="https://images.dog.ceo/breeds/retriever-golden/n02099601_3004.jpg" alt="Profile photo">

    <h1 id="userName">Your Name</h1>
    <p>CSE, 1st Year</p>
    <p>Favourite app: Instagram</p>
    <p>Fun fact: I can solve a Rubik's cube</p>

    <ul id="skillList"></ul>

    <p id="likes">Likes: 0</p>

    <div class="edit">
      <input id="nameInput" type="text" placeholder="Type your name">
      <button id="saveBtn">Update</button>
    </div>

    <div class="buttons">
      <button id="likeBtn">❤️ Like</button>
      <button id="photoBtn">🐶 New Photo</button>
      <button id="themeBtn">🌙 Dark Mode</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
